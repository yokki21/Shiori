# Editoriales de manga desde todostuslibros.com (manual: para añadir una editorial nueva de una vez).
name: Catálogo manga
on:
  workflow_dispatch:
    inputs:
      pub:
        description: Clave de la editorial en tools/update_tl.py (o «todas»)
        default: todas
      probe:
        description: Solo revisar - una dirección, o editoriales separadas por comas (vacío = normal)
        default: ''
permissions:
  contents: write
  pages: write
concurrency:
  group: catalogo
  cancel-in-progress: false
jobs:
  manga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar una página
        if: ${{ github.event.inputs.probe != '' }}
        run: |
          case "${{ github.event.inputs.probe }}" in
            http*) python3 tools/update_tl.py --probe "${{ github.event.inputs.probe }}" ;;
            *) python3 tools/update_tl.py --find "${{ github.event.inputs.probe }}" ;;
          esac
          git config user.name "yokki21"
          git config user.email "jmartinezserrano31@gmail.com"
          git add -f tools/tl_probe.* && git commit -m "Prueba de página" && git push
      - name: Leer los listados
        if: ${{ github.event.inputs.probe == '' }}
        run: python3 tools/update_tl.py --pub "${{ github.event.inputs.pub }}"
      - name: Regenerar el catálogo
        if: ${{ github.event.inputs.probe == '' }}
        run: python3 tools/build_panini.py
      - name: Comprobar el catálogo
        if: ${{ github.event.inputs.probe == '' }}
        run: node --test tests/unit.test.mjs
      - name: Publicar si hay cambios
        if: ${{ github.event.inputs.probe == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "yokki21"
          git config user.email "jmartinezserrano31@gmail.com"
          git add catalog/*.json tools/tl_*.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Catálogo manga: ${{ github.event.inputs.pub }} ($(date +%F))"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se ha podido pedir la publicación"

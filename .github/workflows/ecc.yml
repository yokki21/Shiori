# Catálogo de ECC Ediciones desde todostuslibros.com (manual: la primera vez, o para revisar la estructura).
name: Catálogo ECC
on:
  workflow_dispatch:
    inputs:
      pages:
        description: Páginas del listado (50 libros cada una)
        default: '3'
      probe:
        description: Guardar la primera página para revisarla (si/no)
        default: 'si'
permissions:
  contents: write
concurrency:
  group: catalogo
  cancel-in-progress: false
jobs:
  ecc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer el listado de ECC
        run: python3 tools/update_ecc.py --pages "${{ github.event.inputs.pages }}" ${{ github.event.inputs.probe == 'si' && '--probe' || '' }}
      - name: Guardar
        run: |
          git config user.name "yokki21"
          git config user.email "jmartinezserrano31@gmail.com"
          git add -f tools/ecc_raw.json tools/ecc_probe.html 2>/dev/null || git add tools/ecc_raw.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "ECC: listado de todostuslibros.com ($(date +%F))"
          git push
